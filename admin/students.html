<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Management | PlaceMentor AI</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link
rel="stylesheet"
href="css/students.css">

<link
rel="stylesheet"
href="../css/darkmode.css">

<link
rel="stylesheet"
href="../css/toast.css">

</head>

<body data-page="students">

<div class="page">

<!-- ================= HEADER ================= -->

<div class="topbar">

<h1>

👨‍🎓 Student Management

</h1>

<div>

<input

type="text"

id="searchStudent"

placeholder="Search Student...">



<button

id="dashboardBtn"

class="dashboard-link">

Dashboard

</button>

</div>

</div>

<!-- ================= SUMMARY ================= -->

<div class="summary-card">

<h2>

Total Students

</h2>

<h1 id="studentCount">

0

</h1>

</div>

<!-- ================= TABLE ================= -->

<div class="table-card">

<table>

<thead>

<tr>

<th>Name</th>

<th>Student ID</th>

<th>Email</th>

<th>College</th>

<th>Branch</th>

<th>Year</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

<!-- ================= ADD STUDENT MODAL ================= -->

<div
id="studentModal"
class="modal">

<div class="modal-content">

<h2>

➕ Add Student

</h2>

<input
type="text"
id="newName"
placeholder="Student Name">

<input
type="email"
id="newEmail"
placeholder="Email">

<input
type="text"
id="newCollege"
placeholder="College">

<input
type="text"
id="newBranch"
placeholder="Branch">

<input
type="text"
id="newYear"
placeholder="Year">

<div class="modal-buttons">

<button id="saveStudentBtn">

Save

</button>

<button id="closeModalBtn">

Cancel

</button>

</div>

</div>

</div>
<!-- ================= EDIT STUDENT MODAL ================= -->

<div id="editStudentModal" class="modal">

    <div class="modal-content">

        <h2>✏️ Edit Student</h2>

        <input
            type="hidden"
            id="editStudentId">

        <input
            type="text"
            id="editName"
            placeholder="Full Name">

        <input
            type="email"
            id="editEmail"
            placeholder="Email">

        <input
            type="text"
            id="editMobile"
            placeholder="Mobile Number">

        <input
            type="text"
            id="editCollege"
            placeholder="College">

        <input
            type="text"
            id="editDepartment"
            placeholder="Department">

        <input
            type="text"
            id="editYear"
            placeholder="Year of Study">

        <div class="modal-buttons">

            <button
                id="updateStudentBtn">

                Update Student

            </button>

            <button
                id="closeEditModalBtn">

                Cancel

            </button>

        </div>

    </div>

</div>

<script src="../js/storage.js"></script>
<script src="../js/toast.js"></script>

<script src="js/api.js"></script>

<script src="../js/constants.js"></script>
<script src="../js/common.js"></script>
<script src="../js/layout.js"></script>

<script src="js/auth.js"></script>
<script src="js/students.js"></script>

</body>

</html>
