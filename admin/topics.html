<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Topic Management | PlaceMentor AI</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link
rel="stylesheet"
href="css/topics.css">

<link
rel="stylesheet"
href="../css/darkmode.css">

<link
rel="stylesheet"
href="../css/toast.css">

</head>

<body data-page="topics">

<div class="page">

<!-- ================= HEADER ================= -->

<div class="topbar">

<h1>

📚 Topic Management

</h1>

<div class="top-actions">

<input
type="text"
id="searchTopic"
placeholder="Search Topic...">

<select id="categoryFilter">

<option value="All">

All Categories

</option>

</select>

<select id="statusFilter">

<option value="All">

All Status

</option>

<option value="Active">

Active

</option>

<option value="Inactive">

Inactive

</option>

</select>

<button id="addTopicBtn">

<i class="fa-solid fa-plus"></i>

Add Topic

</button>

<button
id="dashboardBtn"

class="dashboard-link">

Dashboard

</button>

</div>

</div>

<!-- ================= SUMMARY ================= -->

<div class="summary-grid">

<div class="summary-card">

<h3>

Total Topics

</h3>

<h1 id="totalTopics">

0

</h1>

</div>

<div class="summary-card">

<h3>

Active Topics

</h3>

<h1 id="activeTopics">

0

</h1>

</div>

<div class="summary-card">

<h3>

Inactive Topics

</h3>

<h1 id="inactiveTopics">

0

</h1>

</div>

</div>

<!-- ================= TABLE ================= -->

<div class="table-card">

<table>

<thead>

<tr>

<th>Topic</th>

<th>Category</th>

<th>Status</th>

<th>Questions</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="topicTable">

</tbody>

</table>

</div>

<!-- ================= MODAL ================= -->

<div
id="topicModal"
class="modal">

<div class="modal-content">

<h2 id="modalTitle">

➕ Add Topic

</h2>

<input
type="text"
id="topicName"
placeholder="Topic Name">

<select id="topicCategory">

</select>

<select id="topicStatus">

<option value="true">

Active

</option>

<option value="false">

Inactive

</option>

</select>

<div class="modal-buttons">

<button id="saveTopicBtn">

💾 Save Topic

</button>

<button id="closeTopicModal">

Cancel

</button>

</div>

</div>

</div>

</div>

<script src="../js/storage.js"></script>
<script src="../js/toast.js"></script>

<script src="js/api.js"></script>

<script src="../js/constants.js"></script>
<script src="../js/common.js"></script>
<script src="../js/layout.js"></script>

<script src="js/auth.js"></script>
<script src="js/topics.js"></script>
</body>

</html>
