<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Category Details | PlaceMentor AI</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link
rel="stylesheet"
href="css/category-details.css">

<link
rel="stylesheet"
href="../css/darkmode.css">

<link
rel="stylesheet"
href="../css/toast.css">

</head>

<body>

<div class="page">

    <!-- ================= HEADER ================= -->

    <div class="topbar">

        <h1>

            📂 Category Details

        </h1>

        <button
        onclick="history.back()">

            ← Back

        </button>

    </div>

    <!-- ================= DETAILS ================= -->

    <div class="details-card">

        <div class="detail-row">

            <span class="label">

                Category Name

            </span>

            <span id="categoryName">

                -

            </span>

        </div>

        <div class="detail-row">

            <span class="label">

                Description

            </span>

            <span id="categoryDescription">

                -

            </span>

        </div>

        <div class="detail-row">

            <span class="label">

                Status

            </span>

            <span id="categoryStatus">

                -

            </span>

        </div>

        <div class="detail-row">

            <span class="label">

                Total Topics

            </span>

            <span id="totalTopics">

                0

            </span>

        </div>

        <div class="detail-row">

            <span class="label">

                Total Questions

            </span>

            <span id="totalQuestions">

                0

            </span>

        </div>

    </div>

</div>

<script src="../js/storage.js"></script>

<script src="../js/toast.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/category-details.js"></script>

</body>

</html>
