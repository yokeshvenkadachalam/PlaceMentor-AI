<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Question Management | PlaceMentor AI</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link
rel="stylesheet"
href="css/questions.css">

<link
rel="stylesheet"
href="../css/darkmode.css">

<link
rel="stylesheet"
href="../css/toast.css">

</head>

<body data-page="questions">

<div class="page">

<!-- ================= HEADER ================= -->

<div class="topbar">

<h1>

📝 Question Management

</h1>

<div class="top-actions">

<input
type="text"
id="searchQuestion"
placeholder="Search Question...">

<select id="categoryFilter">

<option value="All">

All Categories

</option>

<option value="Programming">

Programming

</option>

<option value="Java">

Java

</option>

<option value="SQL">

SQL

</option>

<option value="Aptitude">

Aptitude

</option>

<option value="Reasoning">

Reasoning

</option>

<option value="Verbal">

Verbal

</option>

</select>

<select id="difficultyFilter">

<option value="All">

All Difficulty

</option>

<option value="Easy">

Easy

</option>

<option value="Medium">

Medium

</option>

<option value="Hard">

Hard

</option>

</select>

<button id="addQuestionBtn">

<i class="fa-solid fa-plus"></i>

Add Question

</button>

<button

id="dashboardBtn"

class="dashboard-link">

Dashboard

</button>

</div>

</div>

<!-- ================= SUMMARY ================= -->

<div class="summary-card">

<h2>

Total Questions

</h2>

<h1 id="questionCount">

0

</h1>

</div>

<!-- ================= TABLE ================= -->

<div class="table-card">

<table>

<thead>

<tr>

<th>Question</th>

<th>Category</th>

<th>Difficulty</th>

<th>Correct Answer</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="questionTable">

</tbody>

</table>

</div>

<!-- ================= ADD QUESTION MODAL ================= -->

<div
id="questionModal"
class="modal">

<div class="modal-content">

<h2 id="modalTitle">

➕ Add Question

</h2>

<textarea
id="questionText"
placeholder="Enter Question"></textarea>

<input
type="text"
id="optionA"
placeholder="Option A">

<input
type="text"
id="optionB"
placeholder="Option B">

<input
type="text"
id="optionC"
placeholder="Option C">

<input
type="text"
id="optionD"
placeholder="Option D">

<select id="correctAnswer">

<option value="">

Correct Answer

</option>

<option value="A">

Option A

</option>

<option value="B">

Option B

</option>

<option value="C">

Option C

</option>

<option value="D">

Option D

</option>

</select>
<textarea
    id="explanation"
    placeholder="Enter Explanation">
</textarea>

<select id="questionCategory">

    <option value="">
        Select Category
    </option>

</select>

<select id="questionTopic">

    <option value="">
        Select Topic
    </option>

</select>

<select id="questionDifficulty">

<option value="Easy">

Easy

</option>

<option value="Medium">

Medium

</option>

<option value="Hard">

Hard

</option>

</select>

<div class="modal-buttons">

<button id="saveQuestionBtn">

💾 Save Question

</button>

<button id="closeQuestionModal">

Cancel

</button>

</div>

</div>

</div>

<script src="../js/storage.js"></script>

<script src="../js/toast.js"></script>
<script src="js/api.js"></script>
<script src="../js/constants.js"></script>
<script src="../js/common.js"></script>
<script src="../js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/questions.js"></script>

</body>

</html>
