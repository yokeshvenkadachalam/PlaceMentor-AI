# ==========================================
# Application
# ==========================================
spring.application.name=PlaceMentorAI

# ==========================================
# Server
# ==========================================
server.port=8080

# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/placementor_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Yokesh@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# File Upload
# ==========================================
file.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# Error Handling
# ==========================================
server.error.include-message=always
server.error.include-stacktrace=never

# ==========================================
# Email Configuration (Gmail SMTP)
# ==========================================

