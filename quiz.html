<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz | PlaceMentor AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/toast.css">
    
    <link rel="stylesheet" href="css/darkmode.css">

</head>

<body>

<div class="quiz-container">

    <!-- ================= LEFT SIDE ================= -->

    <div class="quiz-main">

        <!-- Header -->

        <div class="quiz-header">

            <h2 id="quizTitle">
                Aptitude Mock Test
            </h2>

            <div class="timer">
                ⏰ <span id="timer">30:00</span>
            </div>

        </div>

        <!-- Progress -->

        <div class="progress">

            <div id="progressBar"></div>

        </div>

        <!-- Question -->

        <div class="question-box">

            <h3 id="questionNumber">
                Question 1 / 20
            </h3>

            <h2 id="question">
                Loading Question...
            </h2>

        </div>

        <!-- Options -->

        <div class="options">

            <label for="optA">
                <input
                    id="optA"
                    type="radio"
                    name="option"
                    value="A">
                <span id="optionA">Option A</span>
            </label>

            <label for="optB">
                <input
                    id="optB"
                    type="radio"
                    name="option"
                    value="B">
                <span id="optionB">Option B</span>
            </label>

            <label for="optC">
                <input
                    id="optC"
                    type="radio"
                    name="option"
                    value="C">
                <span id="optionC">Option C</span>
            </label>

            <label for="optD">
                <input
                    id="optD"
                    type="radio"
                    name="option"
                    value="D">
                <span id="optionD">Option D</span>
            </label>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button id="prevBtn">
                ⬅ Previous
            </button>

            <button id="bookmarkBtn">
                🔖 Bookmark
            </button>

            <button id="reviewBtn">
                📌 Review Later
            </button>

            <button id="nextBtn">
                Next ➡
            </button>

            <button id="submitBtn">
                ✅ Submit
            </button>

        </div>

    </div>

    <!-- ================= RIGHT SIDE ================= -->

    <div class="palette">

        <h3>
            Question Palette
        </h3>

        <div id="paletteGrid"></div>

        <div class="legend">

            <h4>Status</h4>

            <p>
                🟩 Answered
            </p>

            <p>
                🟨 Review Later
            </p>

            <p>
                ⬜ Not Visited
            </p>

        </div>

    </div>

</div>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/quiz.js"></script>

</body>

</html>
