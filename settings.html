<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings | PlaceMentor AI</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">
<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="css/settings.css">

<link rel="stylesheet"
href="css/toast.css">
<link rel="stylesheet" href="css/darkmode.css">

</head>

<body>

<div class="settings-container">

<h1>

⚙️ Settings

</h1>

<!-- ================= ACCOUNT ================= -->

<div class="settings-card">

    <h2>

        👤 Account

    </h2>

    <div class="setting-item">

        <label>

            Full Name

        </label>

        <input
            type="text"
            id="settingName">

    </div>

    <div class="setting-item">

        <label>

            Student ID

        </label>

        <input
            type="text"
            id="settingId"
            readonly>

    </div>

    <div class="setting-item">

        <label>

            Email

        </label>

        <input
            type="email"
            id="settingEmail">

    </div>

</div>
<!-- ================= APPEARANCE ================= -->

<div class="settings-card">

    <h2>

        🎨 Appearance

    </h2>

    <div class="setting-item">

        <label>

            <input
                type="radio"
                name="theme"
                id="themeLight"
                checked>

            Light Mode

        </label>

    </div>

    <div class="setting-item">

        <label>

            <input
                type="radio"
                name="theme"
                id="themeDark">

            Dark Mode

        </label>

    </div>

</div>

<!-- ================= SECURITY ================= -->

<div class="settings-card">

    <h2>

        🔐 Security

    </h2>

    <div class="setting-item">

        <label>

            Change Password

        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter New Password">

    </div>

    <div class="setting-item">

        <label>

            Confirm Password

        </label>

       <input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Password">

    </div>

</div>

<!-- ================= ACTIONS ================= -->

<div class="buttons">

    <button
        id="saveSettingsBtn">

        💾 Save

    </button>

    <button
        id="logoutBtn">

        🚪 Logout

    </button>

    <button
        id="deleteAccountBtn">

        🗑 Delete Account

    </button>

    <button
        onclick="window.location.href='dashboard.html'">

        ⬅ Dashboard

    </button>

</div>
</div>

<script src="js/storage.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/settings.js"></script>

</body>

</html>
