</head>

<!-- ==========================================
                MAIN
========================================== -->

<main class="main">

<div class="topbar">

<div>

<h1>

<i class="fa-solid fa-user-pen"></i>

Update Admin

</h1>

<p>

Update administrator information.

</p>

</div>

</div>
<!-- ==========================================
                UPDATE ADMIN FORM
========================================== -->

<div class="form-card">

<form id="updateAdminForm">

<div class="form-grid">

<!-- ================= USER ID ================= -->

<div class="form-group">

<label>

User ID

</label>

<div class="input-box">

<i class="fa-solid fa-id-card"></i>

<input
type="text"
id="userId"
readonly>

</div>

</div>

<!-- ================= ROLE ================= -->

<div class="form-group">

<label>

Role

</label>

<div class="input-box">

<i class="fa-solid fa-user-shield"></i>

<input
type="text"
id="role"
readonly>

</div>

</div>

<!-- ================= FULL NAME ================= -->

<div class="form-group">

<label>

Full Name

<span class="required">*</span>

</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="fullName"
placeholder="Enter Full Name"
required>

</div>

</div>

<!-- ================= EMAIL ================= -->

<div class="form-group">

<label>

Email Address

<span class="required">*</span>

</label>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter Email Address"
required>

</div>

</div>

<!-- ================= STATUS ================= -->

<div class="form-group">

<label>

Status

</label>

<div class="input-box">

<i class="fa-solid fa-toggle-on"></i>

<select id="active">

<option value="true">

Active

</option>

<option value="false">

Inactive

</option>

</select>

</div>

</div>

<!-- ================= MASTER ADMIN ================= -->

<div class="form-group">

<label>

Admin Type

</label>

<div class="input-box">

<i class="fa-solid fa-crown"></i>

<input
type="text"
id="adminType"
readonly>

</div>

</div>

</div>
<!-- ==========================================
                FORM ACTIONS
========================================== -->

<div class="form-actions">

<button

type="submit"

class="btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

Update Admin

</button>

<button

type="reset"

class="btn-secondary">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

<button
type="button"
class="btn-secondary"
onclick="reloadAdmin()">

<i class="fa-solid fa-arrows-rotate"></i>

Reload

</button>

<button

type="button"

class="btn-secondary"

onclick="window.location.href='admin-management.html'">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>

</div>

</form>

</div>

                FOOTER
